# Docker Compose cho môi trường PHÁT TRIỂN (dev): hot reload cho cả Backend và Frontend.
# Toàn bộ giá trị nhạy cảm (mật khẩu DB, SECRET_KEY, GROQ_API_KEY...) đọc từ file .env
# ở từng thư mục (backend/.env, frontend/.env) — KHÔNG hard-code trong file này.

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        REQUIREMENTS_FILE: requirements/dev.txt
    restart: unless-stopped
    command: ["runserver"]
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
