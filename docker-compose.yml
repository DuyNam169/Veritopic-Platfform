# Môi trường phát triển: PostgreSQL, Django, React và PhoBERT.
# Tạo backend/.env từ backend/.env.example trước khi chạy.

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ai:
    build:
      context: ./AI_KiemTraTrung_TruongBoMon
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MODEL_NAME: ${PHOBERT_MODEL_NAME:-vinai/phobert-base-v2}
      HF_HOME: /root/.cache/huggingface
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - ./AI_KiemTraTrung_TruongBoMon/models/tier1_best.pt:/app/models/tier1_best.pt:ro
      - huggingface_cache:/root/.cache/huggingface
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "test -s /app/models/tier1_best.pt && python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s

  backend:
    build:
      context: ./backend
      args:
        REQUIREMENTS_FILE: requirements/dev.txt
    restart: unless-stopped
    command: ["runserver"]
    env_file:
      - ./backend/.env
    environment:
      PHOBERT_API_URL: http://ai:8001
    volumes:
      - ./backend:/app
      - backend_static:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  backend_static:
  huggingface_cache:
